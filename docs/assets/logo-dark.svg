<svg xmlns="http://www.w3.org/2000/svg" width="720" height="140" viewBox="0 0 720 140" role="img" aria-label="lora-vs-prompt">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- frozen weight matrix W -->
  <g transform="translate(14 22)">
    <rect x="0" y="0" width="84" height="84" rx="10" fill="#141413" stroke="#4a4945" stroke-width="2"/>
    <g stroke="#4a4945" stroke-width="1.5">
      <line x1="21" y1="6" x2="21" y2="78"/><line x1="42" y1="6" x2="42" y2="78"/><line x1="63" y1="6" x2="63" y2="78"/>
      <line x1="6" y1="21" x2="78" y2="21"/><line x1="6" y1="42" x2="78" y2="42"/><line x1="6" y1="63" x2="78" y2="63"/>
    </g>
    <text x="110" y="52" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#a8a69f" text-anchor="middle">+</text>
    <!-- low-rank update B x A -->
    <rect x="134" y="0" width="16" height="84" rx="6" fill="url(#acc)"/>
    <rect x="160" y="0" width="84" height="16" rx="6" fill="url(#acc)" opacity="0.85"/>
  </g>
  <text x="282" y="72" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-1" fill="#f5f5f4">lora<tspan fill="url(#acc)">-vs-</tspan>prompt</text>
  <text x="284" y="106" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#a8a69f">When does fine-tuning beat prompting? Measured.</text>
</svg>
