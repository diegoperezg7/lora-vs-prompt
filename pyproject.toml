[project]
name = "lora-vs-prompt"
version = "0.1.0"
description = "A reproducible study of when LoRA fine-tuning beats prompting for a structured-extraction task"
authors = [
    { name = "Diego Pérez", email = "diego.perz.garc@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mlx-lm>=0.32.2",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
lvp = "lora_vs_prompt.cli:app"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"src/lora_vs_prompt/report.py" = ["E501"]
